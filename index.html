<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KARATE WORKOUT TIMER</title>

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:10px;
    font-family:Arial,sans-serif;
    text-align:center;
    transition:background-color .3s;
}

h1{
    margin:0;
    font-size:7vw;
}

#mode{
    font-size:12vw;
    font-weight:bold;
    margin-top:10px;
}

#timer{
    font-size:46vw;
    font-weight:bold;
    line-height:0.85;
    margin:0;
}

#round{
    font-size:8vw;
    font-weight:bold;
    margin:10px 0;
}

.ready{
    color:#ff8800;
}

.workout{
    color:#00aa00;
}

.rest{
    color:#0066ff;
}

.warning{
    color:red !important;
}

.controls{
    margin-top:10px;
}

.controls button{
    width:44%;
    height:13vw;
    font-size:5vw;
    margin:3px;
    border:none;
    border-radius:12px;
    background:#333;
    color:white;
}

.settings{
    margin-top:15px;
    padding-top:10px;
    border-top:1px solid #ccc;
}

.settings div{
    margin:10px;
    font-size:5vw;
}

.settings input{
    width:80px;
    font-size:5vw;
    text-align:center;
}

#info{
    margin-top:10px;
    color:#666;
    font-size:3vw;
}

/* Landscape optimization */

@media (orientation: landscape){

    h1{
        font-size:3vw;
    }

    #mode{
        font-size:6vw;
    }

    #timer{
        font-size:32vw;
    }

    #round{
        font-size:3vw;
    }

    .controls button{
        width:20vw;
        height:7vw;
        font-size:2.5vw;
    }

    .settings{
        display:flex;
        justify-content:center;
        gap:20px;
    }

    .settings div{
        font-size:2.5vw;
    }

    .settings input{
        font-size:2.5vw;
    }

    #info{
        font-size:1.5vw;
    }
}

</style>
</head>

<body>

<h1>KARATE WORKOUT TIMER</h1>

<div id="mode" class="ready">READY</div>

<div id="timer">10</div>

<div id="round">ROUND 0</div>

<div class="controls">
    <button onclick="startTimer()">START</button>
    <button onclick="stopTimer()">STOP</button><br>
    <button onclick="resetTimer()">RESET</button>
</div>

<div class="settings">

    <div>
        READY
        <input type="number" id="readySec" value="10" min="0">
    </div>

    <div>
        WORKOUT
        <input type="number" id="workSec" value="30" min="1">
    </div>

    <div>
        REST
        <input type="number" id="restSec" value="30" min="1">
    </div>

</div>

<div id="info">
iPhone: Recommended to go to "Settings->Display&Brightness->Auto-Lock->Never"
Created by Yoshihiko Sakai
</div>

<script>

let phase = "READY";
let remain = 10;
let round = 0;
let timerId = null;
let wakeLock = null;

let audioCtx = null;

async function initAudio(){

    if(!audioCtx){

        audioCtx =
            new (window.AudioContext || window.webkitAudioContext)();
    }

    if(audioCtx.state !== "running"){

        await audioCtx.resume();
    }
}

function tone(freq,duration){

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = freq;
    osc.type = "sine";

    gain.gain.setValueAtTime(0.2,audioCtx.currentTime);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duration / 1000
    );

    osc.stop(audioCtx.currentTime + duration / 1000);
}

function beep(){

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();

    osc.connect(audioCtx.destination);

    osc.frequency.value = 1600;

    osc.start();

    osc.stop(audioCtx.currentTime + 0.1);
}

function buzzer(){

    if(!audioCtx) return;

    tone(450,700);
}

function speak(text){

    if(!window.speechSynthesis) return;

    speechSynthesis.cancel();

    setTimeout(() => {

        const msg =
            new SpeechSynthesisUtterance(text);

        msg.lang = "en-US";
        msg.rate = 1.0;
        msg.pitch = 1.0;
        msg.volume = 1.0;

        speechSynthesis.speak(msg);

    },300);
}

async function requestWakeLock(){

    try{

        if('wakeLock' in navigator){

            wakeLock =
                await navigator.wakeLock.request('screen');
        }

    }catch(err){

        console.log(err);
    }
}

document.addEventListener(
    "visibilitychange",
    async () => {

        if(
            wakeLock !== null &&
            document.visibilityState === "visible"
        ){
            await requestWakeLock();
        }
    }
);

function getReady(){

    return parseInt(
        document.getElementById("readySec").value
    ) || 10;
}

function getWork(){

    return parseInt(
        document.getElementById("workSec").value
    ) || 30;
}

function getRest(){

    return parseInt(
        document.getElementById("restSec").value
    ) || 30;
}

function updateDisplay(){

    const mode =
        document.getElementById("mode");

    const timer =
        document.getElementById("timer");

    timer.textContent = remain;

    if(remain <= 3){
        timer.classList.add("warning");
    }
    else{
        timer.classList.remove("warning");
    }

    switch(phase){

        case "READY":

            mode.textContent = "READY";
            mode.className = "ready";
            document.body.style.backgroundColor =
                "#fff3d6";
            break;

        case "WORKOUT":

            mode.textContent = "WORKOUT";
            mode.className = "workout";
            document.body.style.backgroundColor =
                "#e8ffe8";
            break;

        case "REST":

            mode.textContent = "REST";
            mode.className = "rest";
            document.body.style.backgroundColor =
                "#e8f2ff";
            break;
    }

    document.getElementById("round").textContent =
        "ROUND " + round;
}

function switchPhase(){

    buzzer();

    if(phase === "READY"){

        phase = "WORKOUT";
        remain = getWork();
        round = 1;

        setTimeout(()=>{
            speak("Hajime");
        },800);
    }

    else if(phase === "WORKOUT"){

        phase = "REST";
        remain = getRest();

        setTimeout(()=>{
            speak("Stop");
        },800);
    }

    else{

        phase = "WORKOUT";
        remain = getWork();
        round++;

        setTimeout(()=>{
            speak("Hajime");
        },800);
    }

    updateDisplay();
}

function tick(){

    remain--;

    if(remain >= 1 && remain <= 3){
        beep();
    }

    if(remain <= 0){

        switchPhase();
        return;
    }

    updateDisplay();
}

async function startTimer(){

    if(timerId) return;

    localStorage.setItem("readySec", getReady());
    localStorage.setItem("workSec", getWork());
    localStorage.setItem("restSec", getRest());

    try{

        await initAudio();

    }catch(e){

        console.log(e);
    }

    requestWakeLock();

    document.querySelector(".settings").style.display = "none";
    document.getElementById("info").style.display = "none";

    timerId = setInterval(tick,1000);
}

function stopTimer(){

    clearInterval(timerId);

    timerId = null;

    document.querySelector(".settings").style.display = "";
    document.getElementById("info").style.display = "";
}

function loadSettings(){

    const ready = localStorage.getItem("readySec");
    const work  = localStorage.getItem("workSec");
    const rest  = localStorage.getItem("restSec");

    if(ready !== null){
        document.getElementById("readySec").value = ready;
    }

    if(work !== null){
        document.getElementById("workSec").value = work;
    }

    if(rest !== null){
        document.getElementById("restSec").value = rest;
    }
}

function resetTimer(){

    stopTimer();

    phase = "READY";
    remain = getReady();
    round = 0;

    updateDisplay();
}

loadSettings();
resetTimer();

</script>
